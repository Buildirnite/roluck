<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RoLuck Convertidor — Convierte imágenes gratis en tu navegador</title>
    <meta name="description" content="Convierte PNG, JPEG, WebP y AVIF. Quita fondos, recorta, comprime, exporta a PDF y más — todo desde tu navegador. Tus imágenes nunca se suben a ningún servidor." />
    <link rel="canonical" href="https://roluck.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoLuck Convertidor" />
    <meta property="og:url" content="https://roluck.app" />
    <meta property="og:title" content="RoLuck Convertidor — Convierte imágenes gratis" />
    <meta property="og:description" content="Convierte, edita y comprime imágenes en tu navegador. PNG, JPEG, WebP, AVIF, quitar fondo, PDF y más. Sin subir nada a ningún servidor." />
    <meta property="og:image" content="https://roluck.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RoLuck Convertidor" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoLuck Convertidor" />
    <meta name="twitter:description" content="Convierte y edita imágenes en tu navegador. Privado, gratis y sin límites." />
    <meta name="twitter:image" content="https://roluck.app/og-image.png" />

    <!-- Structured data: marca (Organization + WebSite) y la propia app (WebApplication).
         Organization/WebSite fijan el nombre "RoLuck" para las búsquedas de marca. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://roluck.app/#organization",
          "name": "RoLuck",
          "url": "https://roluck.app",
          "logo": "https://roluck.app/pwa-512.png",
          "image": "https://roluck.app/og-image.png",
          "description": "RoLuck es un conjunto gratuito de herramientas de imagen que funcionan dentro del navegador, sin subir archivos a ningún servidor."
        },
        {
          "@type": "WebSite",
          "@id": "https://roluck.app/#website",
          "name": "RoLuck Convertidor",
          "alternateName": "RoLuck",
          "url": "https://roluck.app",
          "inLanguage": "es",
          "publisher": { "@id": "https://roluck.app/#organization" }
        },
        {
          "@type": "WebApplication",
          "name": "RoLuck Convertidor",
          "url": "https://roluck.app",
          "description": "Convierte y edita imágenes directamente en el navegador. Sin subir archivos.",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "publisher": { "@id": "https://roluck.app/#organization" },
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        }
      ]
    }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RoLuck" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fuentes self-hosted (en /fonts, generadas por scripts/gen-fonts.cjs). Precargamos
         las críticas del primer render: Space Grotesk 500 (cuerpo) y JetBrains Mono 400. -->
    <link rel="preload" href="/fonts/space-grotesk-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
