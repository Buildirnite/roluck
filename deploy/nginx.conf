# ── RoLuck Convertidor — server block de Nginx ────────────────────────────────
# SPA (React Router): try_files al index.html. MIME correcto para .webmanifest y
# .wasm. El service worker se sirve SIN caché para que las actualizaciones lleguen.
# Los assets con hash en el nombre se cachean de forma agresiva e inmutable.
#
# Uso: ajusta server_name y root, copia a /etc/nginx/sites-available/roluck,
# enlaza a sites-enabled, `nginx -t`, recarga. Luego `certbot --nginx` añade el
# bloque 443 con SSL automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name roluck.app www.roluck.app;          # ← tu dominio

    root /var/www/roluck;                            # ← carpeta con el contenido de /dist
    index index.html;

    # Compresión.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/wasm;

    # MIME que algunas instalaciones no traen por defecto.
    types {
        application/manifest+json  webmanifest;
        application/wasm           wasm;
    }

    # Service worker: nunca cachear (así el navegador detecta nuevas versiones).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Manifest: poca caché, MIME correcto.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Assets con hash (immutables): caché agresiva de 1 año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # WASM con su MIME (códecs AVIF, modelos de quitar fondo).
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA + prerender SEO: para cada ruta se prueba el .html estático generado por
    # scripts/prerender.cjs (p. ej. /convertir → /convertir.html con su propia meta) y,
    # si no existe, cae al index. React Router toma el control tras hidratar.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Los HTML (index + prerenders) no se cachean: apuntan a los assets con hash
    # actuales y deben reflejar los cambios de meta al desplegar.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
